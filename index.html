<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack - Dashboard Operador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- NUEVO: Librería gratuita para generar Códigos QR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-xl flex items-center gap-2">📦 LogiTrack MVP | Centro de Control</h1>
        <div class="flex items-center gap-3">
            <span class="flex items-center gap-2 text-sm bg-emerald-900/50 text-emerald-400 px-3 py-1 rounded-full">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> En Vivo
            </span>
        </div>
    </header>

    <main class="p-6 max-w-6xl mx-auto mt-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
        
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-1 h-fit">
            <h2 class="text-lg font-bold text-slate-800 mb-4">➕ Registrar Nuevo Envío</h2>
            <form id="form-envio" class="flex flex-col gap-4">
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Número de Tracking</label>
                    <input type="text" id="tracking" required class="w-full border border-slate-300 rounded p-2 text-sm uppercase font-mono" placeholder="Ej: TRK-1001">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Dirección de Destino</label>
                    <input type="text" id="destino" required class="w-full border border-slate-300 rounded p-2 text-sm" placeholder="Calle, Número, Ciudad">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-slate-600 mb-1">Peso (kg)</label>
                    <input type="number" step="0.1" id="peso" required class="w-full border border-slate-300 rounded p-2 text-sm" placeholder="Ej: 2.5">
                </div>
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 px-4 rounded transition-colors mt-2">
                    Ingresar al Sistema
                </button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 lg:col-span-2">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Monitor de Envíos Activos</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="p-3">Tracking</th>
                            <!-- NUEVA COLUMNA PARA EL QR -->
                            <th class="p-3 text-center">Código QR</th>
                            <th class="p-3">Destino</th>
                            <th class="p-3">Peso</th>
                            <th class="p-3">Estado Actual</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-envios" class="divide-y divide-slate-100">
                        <!-- Los datos aparecerán aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://cxaxiflqndariyponszz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4YXhpZmxxbmRhcml5cG9uc3p6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NzMyNTcsImV4cCI6MjEwNDM0OTI1N30.5A5Nmi409xd85-kZD9vOdtX1sALggGq7ilvBSVL-JAg';
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function cargarEnvios() {
            // Quitamos el ".order('id')" para que la base de datos no arroje error
            const { data, error } = await db.from('shipments').select('*');
            if (error) return console.error("Error cargando datos:", error);

            const tabla = document.getElementById('tabla-envios');
            let filasHtml = ''; 

            // 1. Armamos todas las filas primero
            data.forEach(envio => {
                let colorEstado = '';
                if (envio.current_status === 'ENTREGADO') colorEstado = 'bg-green-100 text-green-800';
                else if (envio.current_status === 'EN_REPARTO') colorEstado = 'bg-yellow-100 text-yellow-800';
                else colorEstado = 'bg-blue-100 text-blue-800'; 

                filasHtml += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-mono font-bold text-slate-900">${envio.tracking_number}</td>
                        <td class="p-3 text-center">
                            <div id="qr-${envio.tracking_number}" class="inline-block p-1 bg-white border border-slate-200 rounded shadow-sm"></div>
                        </td>
                        <td class="p-3">${envio.destination_address}</td>
                        <td class="p-3">${envio.weight_kg} kg</td>
                        <td class="p-3"><span class="px-2 py-1 rounded text-xs font-bold ${colorEstado}">${envio.current_status}</span></td>
                    </tr>
                `;
            });

            // Insertamos las filas en la pantalla
            tabla.innerHTML = filasHtml;

            // 2. Esperamos un instante minúsculo y dibujamos los QR de forma segura
            setTimeout(() => {
                data.forEach(envio => {
                    const contenedor = document.getElementById(`qr-${envio.tracking_number}`);
                    if (contenedor) {
                        try {
                            new QRCode(contenedor, {
                                text: envio.tracking_number,
                                width: 64,
                                height: 64,
                                colorDark : "#0f172a",
                                colorLight : "#ffffff",
                                correctLevel : QRCode.CorrectLevel.L
                            });
                        } catch (e) {
                            console.error("Error creando QR", e);
                        }
                    }
                });
            }, 50);
        }
            // 2. Dibujamos los Códigos QR en cada fila
            data.forEach(envio => {
                new QRCode(document.getElementById(`qr-${envio.tracking_number}`), {
                    text: envio.tracking_number, // El QR guardará el número de tracking
                    width: 64, // Tamaño en píxeles
                    height: 64,
                    colorDark : "#0f172a", // Color oscuro del QR
                    colorLight : "#ffffff", // Fondo blanco
                    correctLevel : QRCode.CorrectLevel.L
                });
            });
        }

        document.getElementById('form-envio').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const btn = e.target.querySelector('button');
            btn.innerHTML = 'Guardando...';
            btn.disabled = true;

            const tracking = document.getElementById('tracking').value.toUpperCase();
            const destino = document.getElementById('destino').value;
            const peso = document.getElementById('peso').value;

            const { error } = await db.from('shipments').insert([{
                tracking_number: tracking,
                destination_address: destino,
                weight_kg: peso,
                current_status: 'CREADO' 
            }]);

            if (error) {
                alert('Hubo un error al registrar el paquete: ' + error.message);
            } else {
                e.target.reset(); 
            }

            btn.innerHTML = 'Ingresar al Sistema';
            btn.disabled = false;
        });

        cargarEnvios();

        db.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'shipments' }, (payload) => {
                cargarEnvios(); 
            })
            .subscribe();
    </script>
</body>
</html>
