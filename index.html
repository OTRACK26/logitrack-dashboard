<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LogiTrack - Dashboard Operador</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
    <header class="bg-slate-900 text-white p-4 shadow-md flex justify-between items-center">
        <h1 class="font-bold text-xl flex items-center gap-2">📦 LogiTrack MVP | Centro de Control</h1>
        <div class="flex items-center gap-3">
            <span class="flex items-center gap-2 text-sm bg-emerald-900/50 text-emerald-400 px-3 py-1 rounded-full">
                <span class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></span> En Vivo
            </span>
        </div>
    </header>

    <main class="p-6 max-w-5xl mx-auto mt-6">
        <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-bold text-slate-800 mb-4">Envíos Activos</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-600">
                    <thead class="bg-slate-50 border-b border-slate-200">
                        <tr>
                            <th class="p-3">Tracking</th>
                            <th class="p-3">Destino</th>
                            <th class="p-3">Peso</th>
                            <th class="p-3">Estado Actual</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-envios" class="divide-y divide-slate-100">
                        <!-- Los datos aparecerán aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // ¡Atención! Deberás reemplazar estos dos valores con los de tu bloc de notas
        const SUPABASE_URL = 'https://cxaxiflqndariyponszz.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4YXhpZmxxbmRhcml5cG9uc3p6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3NzMyNTcsImV4cCI6MjEwNDM0OTI1N30.5A5Nmi409xd85-kZD9vOdtX1sALggGq7ilvBSVL-JAg';

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function cargarEnvios() {
            const { data, error } = await supabase.from('shipments').select('*');
            if (error) {
                console.error("Error cargando datos:", error);
                return;
            }

            const tabla = document.getElementById('tabla-envios');
            tabla.innerHTML = ''; // Limpiar tabla

            data.forEach(envio => {
                let colorEstado = envio.current_status === 'ENTREGADO' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800';
                
                tabla.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-mono font-medium text-slate-900">${envio.tracking_number}</td>
                        <td class="p-3">${envio.destination_address}</td>
                        <td class="p-3">${envio.weight_kg} kg</td>
                        <td class="p-3">
                            <span class="px-2 py-1 rounded text-xs font-bold ${colorEstado}">
                                ${envio.current_status}
                            </span>
                        </td>
                    </tr>
                `;
            });
        }

        // Cargar al inicio
        cargarEnvios();

        // Escuchar cambios en tiempo real
        supabase.channel('custom-all-channel')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'shipments' }, (payload) => {
                console.log('¡Cambio detectado!', payload);
                cargarEnvios(); // Recargar la tabla si un chofer entrega algo
            })
            .subscribe();
    </script>
</body>
</html>
